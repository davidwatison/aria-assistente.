<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090b12">
<title>ARIA 3.0 — Inteligência Artificial</title>

<style>
:root {
  --bg: #090b12;
  --panel: #10131e;
  --panel2: #171c2b;
  --border: rgba(255,255,255,.09);
  --text: #f3f5ff;
  --muted: #969db5;
  --cyan: #67e8f9;
  --purple: #a78bfa;
  --danger: #ff7185;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, Arial, sans-serif;
  height: 100dvh;
  overflow: hidden;
}

button, input, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  display: flex;
  height: 100dvh;
}

/* MENU LATERAL */

.sidebar {
  width: 270px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 22px 16px;
  background: #0d1019;
  border-right: 1px solid var(--border);
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 25px;
}

.logo {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: linear-gradient(135deg, #123444, #30204b);
  border: 1px solid #3a6174;
  color: var(--cyan);
  font-size: 24px;
  font-weight: 900;
  box-shadow: 0 0 25px #67e8f91a;
}

.brand-name {
  font-size: 23px;
  font-weight: 850;
  letter-spacing: 2px;
}

.brand-sub {
  color: var(--muted);
  font-size: 11px;
  margin-top: 3px;
}

button {
  transition: .2s;
}

.new-chat {
  width: 100%;
  padding: 13px;
  border: 1px solid #31566a;
  border-radius: 12px;
  background: linear-gradient(110deg, #172b39, #241b3b);
  color: white;
  text-align: left;
}

.new-chat:hover {
  border-color: var(--cyan);
  transform: translateY(-1px);
}

.section-label {
  color: #858ca4;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.5px;
  margin: 25px 4px 12px;
}

.search-box {
  width: 100%;
  padding: 11px;
  border-radius: 10px;
  background: var(--panel2);
  color: white;
  border: 1px solid var(--border);
  outline: none;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  margin-top: 10px;
}

.history-item {
  display: flex;
  gap: 5px;
  margin-bottom: 5px;
}

.history-open {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
  padding: 11px;
  border: 1px solid transparent;
  border-radius: 9px;
  color: #c5cbe0;
  background: transparent;
}

.history-open:hover,
.history-open.active {
  background: var(--panel2);
  border-color: var(--border);
  color: white;
}

.delete-chat {
  border: 0;
  background: transparent;
  color: #858ca4;
  border-radius: 8px;
}

.delete-chat:hover {
  color: var(--danger);
  background: #ff71851a;
}

.sidebar-footer {
  color: #777f98;
  font-size: 11px;
  text-align: center;
  padding-top: 16px;
}

/* CONVERSA */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 25px;
  border-bottom: 1px solid var(--border);
  background: #0b0e17;
}

.top-title {
  font-weight: 750;
  letter-spacing: .5px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #a9b1c9;
  font-size: 12px;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #5ee7a0;
  box-shadow: 0 0 10px #5ee7a0;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 30px 18px;
  scroll-behavior: smooth;
}

.welcome {
  max-width: 720px;
  margin: 8vh auto 35px;
  text-align: center;
}

.welcome-logo {
  width: 76px;
  height: 76px;
  margin: auto auto 20px;
  display: grid;
  place-items: center;
  border-radius: 25px;
  font-size: 37px;
  font-weight: 900;
  color: var(--cyan);
  background: linear-gradient(135deg, #123444, #30204b);
  border: 1px solid #31566a;
  box-shadow: 0 0 50px #67e8f914;
}

.welcome h1 {
  font-size: clamp(27px, 5vw, 43px);
  margin: 0 0 12px;
}

.gradient {
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  background-clip: text;
  -webkit-background-clip: text;
  color: transparent;
}

.welcome p {
  color: var(--muted);
  line-height: 1.7;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-top: 30px;
}

.suggestion {
  padding: 15px;
  text-align: left;
  color: #dce3f8;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 13px;
}

.suggestion:hover {
  border-color: var(--cyan);
  background: #141b29;
}

.message {
  max-width: 850px;
  margin: 0 auto 23px;
  display: flex;
  gap: 13px;
  align-items: flex-start;
}

.avatar {
  width: 35px;
  height: 35px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  font-size: 13px;
  font-weight: 800;
}

.message.user .avatar {
  background: #25283a;
  color: #e1d5ff;
}

.message.assistant .avatar {
  background: #123444;
  color: var(--cyan);
}

.message-content {
  flex: 1;
  min-width: 0;
  line-height: 1.75;
  overflow-wrap: anywhere;
}

.message-role {
  font-weight: 750;
  margin-bottom: 5px;
  font-size: 13px;
}

.message.user .message-role {
  color: #c9b8ff;
}

.message.assistant .message-role {
  color: var(--cyan);
}

.message-text {
  white-space: pre-wrap;
}

.message-actions {
  margin-top: 9px;
}

.copy-button,
.voice-button {
  color: #929bb4;
  background: transparent;
  border: 1px solid var(--border);
  padding: 5px 9px;
  border-radius: 7px;
  font-size: 11px;
  margin-right: 5px;
}

.copy-button:hover,
.voice-button:hover {
  color: var(--cyan);
  border-color: var(--cyan);
}

.typing {
  color: var(--muted);
  font-size: 13px;
  animation: pulse 1.2s infinite;
}

@keyframes pulse {
  50% { opacity: .35; }
}

/* CAMPO DE ENVIO */

.composer-area {
  padding: 12px 18px 18px;
  background: linear-gradient(transparent, #090b12 20%);
}

.composer {
  max-width: 850px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 10px;
  background: #151925;
  border: 1px solid #30384a;
  border-radius: 17px;
  box-shadow: 0 10px 40px #0004;
}

.composer:focus-within {
  border-color: #497b8e;
  box-shadow: 0 0 0 3px #67e8f90c;
}

#messageInput {
  flex: 1;
  min-width: 0;
  max-height: 180px;
  resize: none;
  border: 0;
  outline: 0;
  background: transparent;
  color: white;
  padding: 9px 5px;
  line-height: 1.5;
}

#messageInput::placeholder {
  color: #858ca4;
}

.send-button {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #67e8f9, #a78bfa);
  color: #0a1018;
  font-size: 20px;
  font-weight: 900;
}

.send-button:hover {
  filter: brightness(1.15);
  transform: translateY(-1px);
}

.send-button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.disclaimer {
  max-width: 850px;
  margin: 10px auto 0;
  color: #727b94;
  font-size: 10px;
  text-align: center;
}

/* CELULAR */

@media (max-width: 720px) {
  .sidebar {
    width: 72px;
    padding: 15px 8px;
  }

  .brand {
    justify-content: center;
    margin-bottom: 20px;
  }

  .brand-text,
  .new-chat span,
  .section-label,
  .search-box,
  .history-list,
  .sidebar-footer {
    display: none;
  }

  .new-chat {
    text-align: center;
    padding: 12px 5px;
  }

  .topbar {
    height: 60px;
    padding: 0 14px;
  }

  .messages {
    padding: 22px 13px;
  }

  .suggestions {
    grid-template-columns: 1fr;
  }

  .welcome {
    margin-top: 5vh;
  }

  .composer-area {
    padding: 10px;
  }

  .message {
    gap: 9px;
  }
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="logo">A</div>
      <div class="brand-text">
        <div class="brand-name">ARIA</div>
        <div class="brand-sub">INTELIGÊNCIA ARTIFICIAL</div>
      </div>
    </div>

    <button class="new-chat" id="newChatButton">
      <span>＋ Nova conversa</span>
      <span aria-hidden="true">＋</span>
    </button>

    <div class="section-label">Histórico</div>

    <input
      class="search-box"
      id="historySearch"
      placeholder="Pesquisar conversas..."
      autocomplete="off"
    >

    <div class="history-list" id="historyList"></div>

    <div class="sidebar-footer">
      ARIA 3.0 · Contexto inteligente
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-title">ARIA <span class="gradient">3.0</span></div>

      <div class="status">
        <span class="status-dot"></span>
        Assistente online
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="welcome-logo">A</div>

        <h1>Olá! Eu sou a <span class="gradient">ARIA</span></h1>

        <p>
          Sua assistente virtual inteligente.<br>
          Pergunte, explore ideias e crie coisas incríveis.
        </p>

        <div class="suggestions">
          <button class="suggestion" data-prompt="Me ensine a criar um jogo do zero.">
            🎮 Como criar um jogo?
          </button>

          <button class="suggestion" data-prompt="Me ajude a criar um site moderno usando HTML, CSS e JavaScript.">
            💻 Criar um site
          </button>

          <button class="suggestion" data-prompt="Explique inteligência artificial de forma simples.">
            🧠 Aprender sobre IA
          </button>

          <button class="suggestion" data-prompt="Me dê uma ideia criativa para um projeto de programação.">
            ✨ Ideias de projetos
          </button>
        </div>
      </div>
    </section>

    <footer class="composer-area">
      <form class="composer" id="chatForm">
        <textarea
          id="messageInput"
          rows="1"
          placeholder="Converse com a ARIA..."
          aria-label="Digite sua mensagem"
          required
        ></textarea>

        <button class="send-button" id="sendButton" type="submit" aria-label="Enviar">
          ↑
        </button>
      </form>

      <div class="disclaimer">
        A ARIA pode cometer erros. Verifique informações importantes.
      </div>
    </footer>
  </main>
</div>

<script>
"use strict";

// Endereço do Worker da Cloudflare.
const WORKER_URL =
  "https://ancient-heart-7e39.00001134392126sp.workers.dev";

// Chaves utilizadas para guardar o histórico neste navegador.
const STORAGE_KEY = "aria3_conversations";
const ACTIVE_KEY = "aria3_active_conversation";

const messagesElement = document.getElementById("messages");
const welcomeElement = document.getElementById("welcome");
const historyList = document.getElementById("historyList");
const historySearch = document.getElementById("historySearch");
const input = document.getElementById("messageInput");
const sendButton = document.getElementById("sendButton");
const chatForm = document.getElementById("chatForm");

let conversations = loadConversations();
let activeId = localStorage.getItem(ACTIVE_KEY);

function createId() {
  return Date.now().toString(36) +
    Math.random().toString(36).slice(2, 9);
}

function loadConversations() {
  try {
    const saved = JSON.parse(
      localStorage.getItem(STORAGE_KEY) || "[]"
    );

    return Array.isArray(saved) ? saved : [];
  } catch (error) {
    console.error("Não foi possível carregar o histórico:", error);
    return [];
  }
}

function saveConversations() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(conversations)
    );

    if (activeId) {
      localStorage.setItem(ACTIVE_KEY, activeId);
    } else {
      localStorage.removeItem(ACTIVE_KEY);
    }
  } catch (error) {
    console.error("Não foi possível salvar o histórico:", error);
  }
}

function activeConversation() {
  return conversations.find(chat => chat.id === activeId) || null;
}

function createConversation() {
  const conversation = {
    id: createId(),
    title: "Nova conversa",
    createdAt: Date.now(),
    updatedAt: Date.now(),
    messages: []
  };

  conversations.unshift(conversation);
  activeId = conversation.id;

  saveConversations();
  renderHistory();
  renderConversation();

  input.focus();
}

function renderHistory() {
  const query = historySearch.value.trim().toLowerCase();

  historyList.replaceChildren();

  const filtered = conversations.filter(chat => {
    const titleMatches = chat.title.toLowerCase().includes(query);

    const messageMatches = chat.messages.some(message =>
      message.content.toLowerCase().includes(query)
    );

    return titleMatches || messageMatches;
  });

  filtered.forEach(chat => {
    const row = document.createElement("div");
    row.className = "history-item";

    const openButton = document.createElement("button");
    openButton.className =
      "history-open" + (chat.id === activeId ? " active" : "");
    openButton.textContent = chat.title;
    openButton.title = chat.title;

    openButton.addEventListener("click", () => {
      activeId = chat.id;
      saveConversations();
      renderHistory();
      renderConversation();
    });

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete-chat";
    deleteButton.textContent = "×";
    deleteButton.title = "Excluir conversa";
    deleteButton.setAttribute("aria-label", "Excluir conversa");

    deleteButton.addEventListener("click", () => {
      conversations = conversations.filter(item => item.id !== chat.id);

      if (activeId === chat.id) {
        activeId = conversations[0]?.id || null;
      }

      saveConversations();
      renderHistory();
      renderConversation();
    });

    row.append(openButton, deleteButton);
    historyList.appendChild(row);
  });
}

function renderConversation() {
  messagesElement.replaceChildren();

  const conversation = activeConversation();

  if (!conversation || conversation.messages.length === 0) {
    messagesElement.appendChild(welcomeElement);
    welcomeElement.style.display = "block";
    return;
  }

  welcomeElement.style.display = "none";

  conversation.messages.forEach(message => {
    renderMessage(message.role, message.content);
  });

  scrollToBottom();
}

function renderMessage(role, text) {
  const row = document.createElement("article");
  row.className = "message " + role;

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "VOCÊ" : "A";

  const content = document.createElement("div");
  content.className = "message-content";

  const name = document.createElement("div");
  name.className = "message-role";
  name.textContent = role === "user" ? "Você" : "ARIA";

  const textElement = document.createElement("div");
  textElement.className = "message-text";
  textElement.textContent = text;

  content.append(name, textElement);

  if (role === "assistant") {
    const actions = document.createElement("div");
    actions.className = "message-actions";

    const copyButton = document.createElement("button");
    copyButton.className = "copy-button";
    copyButton.textContent = "Copiar";

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyButton.textContent = "Copiado!";
        setTimeout(() => {
          copyButton.textContent = "Copiar";
        }, 1500);
      } catch {
        copyButton.textContent = "Não foi possível copiar";
      }
    });

    const voiceButton = document.createElement("button");
    voiceButton.className = "voice-button";
    voiceButton.textContent = "🔊 Ouvir";

    voiceButton.addEventListener("click", () => {
      if (!("speechSynthesis" in window)) {
        alert("Seu navegador não oferece leitura de voz.");
        return;
      }

      speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "pt-BR";
      utterance.rate = 1;

      speechSynthesis.speak(utterance);
    });

    actions.append(copyButton, voiceButton);
    content.appendChild(actions);
  }

  row.append(avatar, content);
  messagesElement.appendChild(row);
}

function addMessage(role, content) {
  const conversation = activeConversation();

  if (!conversation) return;

  const message = {
    role,
    content,
    timestamp: Date.now()
  };

  conversation.messages.push(message);
  conversation.updatedAt = Date.now();

  if (
    role === "user" &&
    conversation.title === "Nova conversa"
  ) {
    conversation.title =
      content.slice(0, 35) +
      (content.length > 35 ? "…" : "");
  }

  saveConversations();
  welcomeElement.style.display = "none";
  renderMessage(role, content);
  renderHistory();
  scrollToBottom();
}

function scrollToBottom() {
  messagesElement.scrollTop = messagesElement.scrollHeight;
}

function showTyping() {
  const typing = document.createElement("div");
  typing.id = "typingIndicator";
  typing.className = "message assistant";

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = "A";

  const content = document.createElement("div");
  content.className = "message-content";

  const label = document.createElement("div");
  label.className = "message-role";
  label.textContent = "ARIA";

  const text = document.createElement("div");
  text.className = "typing";
  text.textContent = "Pensando...";

  content.append(label, text);
  typing.append(avatar, content);
  messagesElement.appendChild(typing);

  scrollToBottom();
}

function removeTyping() {
  document.getElementById("typingIndicator")?.remove();
}

async function sendMessage(text) {
  const cleanText = text.trim();

  if (!cleanText || sendButton.disabled) return;

  if (!activeConversation()) {
    const conversation = {
      id: createId(),
      title: "Nova conversa",
      createdAt: Date.now(),
      updatedAt: Date.now(),
      messages: []
    };

    conversations.unshift(conversation);
    activeId = conversation.id;
  }

  // Guarda a mensagem do usuário.
  addMessage("user", cleanText);

  input.value = "";
  input.style.height = "auto";
  sendButton.disabled = true;
  showTyping();

  try {
    const conversation = activeConversation();

    // Envia o histórico anterior para a IA.
    const history = conversation.messages
      .slice(-12)
      .map(message => ({
        role: message.role,
        content: message.content
      }));

    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: cleanText,
        messages: history
      })
    });

    const data = await response.json();

    removeTyping();

    if (!response.ok) {
      throw new Error(
        data.details ||
        data.error ||
        "Erro HTTP " + response.status
      );
    }

    if (typeof data.reply !== "string") {
      throw new Error("A resposta do Worker não contém o campo reply.");
    }

    addMessage("assistant", data.reply);

  } catch (error) {
    console.error("Erro na conexão com a ARIA:", error);
    removeTyping();

    addMessage(
      "assistant",
      "Não consegui me conectar à inteligência artificial. " +
      "Verifique a publicação do Worker e os logs da Cloudflare. " +
      "Detalhe: " + error.message
    );

  } finally {
    sendButton.disabled = false;
    renderHistory();
    input.focus();
  }
}

chatForm.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage(input.value);
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 180) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    chatForm.requestSubmit();
  }
});

document.getElementById("newChatButton")
  .addEventListener("click", createConversation);

historySearch.addEventListener("input", renderHistory);

document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => {
    sendMessage(button.dataset.prompt);
  });
});

// Restaura a última conversa ao abrir o site.
if (!activeConversation()) {
  activeId = conversations[0]?.id || null;
}

renderHistory();
renderConversation();
saveConversations();
</script>
</body>
</html>
